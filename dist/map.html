<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>方言全景地图 · 方言文化保护</title>
    <script type="module" crossorigin src="./assets/main-B_dECZm4.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-DJTfSRLh.css">
    <link rel="stylesheet" crossorigin href="./assets/style-DzR8pS9F.css">
  </head>
  <body class="m-0 h-full overflow-hidden antialiased">
    <div id="app" class="h-full"></div>
    <!-- 非 module：避免参与 Vite 打包入口分析；file 协议下直接提示 -->
    <script>
      (function () {
        if (location.protocol !== "file:") return;
        var el = document.getElementById("app");
        if (!el) return;
        el.innerHTML =
          '<div style="font-family:system-ui,-apple-system,sans-serif;padding:clamp(1rem,4vw,2rem);max-width:32rem;margin:0 auto;line-height:1.65;color:#152322">' +
          '<h1 style="font-size:1.15rem;margin:0 0 0.75rem">地图页需要通过 Vite 开发服务器打开</h1>' +
          '<p style="margin:0 0 0.75rem">不能双击用 <code>file://</code> 打开本页。请在项目目录执行 <code>npm run dev</code> 后访问 <strong>http://localhost:5173/map.html</strong>，或先 <code>npm run build</code> 再 <code>npm run preview</code>。</p>' +
          "</div>";
      })();
    </script>
  </body>
</html>
