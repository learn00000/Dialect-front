<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>每日方言闯关 · 语韵东方</title>
    <script type="module" crossorigin src="./assets/main-L9sMgE4Z.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-d0ZaUPj3.css">
    <link rel="stylesheet" crossorigin href="./assets/style-DiEPWX_o.css">
  </head>
  <body class="m-0 h-full overflow-hidden antialiased">
    <div id="app" class="h-full"></div>
    <script>
      (function () {
        var el = document.getElementById("app");
        if (!el) return;
        function showNeedViteHint() {
          el.innerHTML =
            '<div style="font-family:system-ui,-apple-system,sans-serif;padding:clamp(1rem,4vw,2rem);max-width:36rem;margin:0 auto;line-height:1.65;color:#152322">' +
            '<h1 style="font-size:1.15rem;margin:0 0 0.75rem">方音拾级页不能只用静态服务器打开</h1>' +
            '<p style="margin:0 0 0.75rem">本页使用 Vue 组件，<code>npx serve .</code> 无法编译 <code>.vue</code> 文件，因此会白屏。</p>' +
            '<p style="margin:0 0 0.5rem"><strong>开发调试：</strong>在项目目录执行 <code>npm run dev</code>，访问 <strong>http://localhost:5173/study.html</strong></p>' +
            '<p style="margin:0"><strong>静态预览：</strong>先 <code>npm run build</code>，再 <code>npx serve dist -l 3000</code>，访问 <strong>http://localhost:3000/study.html</strong></p>' +
            "</div>";
        }
        if (location.protocol === "file:") {
          showNeedViteHint();
          return;
        }
        window.addEventListener(
          "error",
          function (e) {
            var msg = String((e && e.message) || "");
            if (msg.indexOf(".vue") !== -1 || msg.indexOf("MIME") !== -1) showNeedViteHint();
          },
          true
        );
        window.setTimeout(function () {
          if (!el.children.length && !String(el.textContent || "").trim()) showNeedViteHint();
        }, 2800);
      })();
    </script>
  </body>
</html>
